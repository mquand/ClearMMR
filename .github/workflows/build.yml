name: Build macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ClearMMR.app
        run: bash scripts/build-app.sh

      - name: Nén .app thành zip
        run: ditto -c -k --keepParent build/ClearMMR.app build/ClearMMR.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearMMR
          path: build/ClearMMR.zip
          retention-days: 30

      - name: Tạo GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ClearMMR.zip
