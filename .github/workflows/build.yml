name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ClearMMR.app
        run: bash scripts/build-app.sh "${GITHUB_REF_NAME#v}"

      - name: Package zip + dmg
        run: |
          mkdir -p dist build/dmg
          ditto -c -k --keepParent build/ClearMMR.app "dist/ClearMMR-${GITHUB_REF_NAME}.zip"
          cp -R build/ClearMMR.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "ClearMMR" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "dist/ClearMMR-${GITHUB_REF_NAME}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearMMR-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.dmg \
              --title "ClearMMR ${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi
